[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "type-evidence"
version = "0.2.0"
description = "Font discovery and typography for AI agents: explore real local fonts, compare in context, and use exact styles through CLI or MCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["fonts", "typography", "font-discovery", "ai-agents", "mcp", "fontclip"]
requires-python = ">=3.10"
dependencies = ["fonttools[woff]==4.60.2", "Pillow==11.3.0", "uharfbuzz==0.52.0", "freetype-py==2.5.1"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
visual = ["torch==2.8.0", "torchvision==0.23.0", "open_clip_torch==3.2.0", "gdown==5.2.0", "numpy>=1.26,<3"]

[project.urls]
Homepage = "https://gavinjudd.github.io/type-evidence/"
Documentation = "https://github.com/gavinjudd/type-evidence/blob/main/docs/getting-started.md"
Repository = "https://github.com/gavinjudd/type-evidence"
Issues = "https://github.com/gavinjudd/type-evidence/issues"
Contributing = "https://github.com/gavinjudd/type-evidence/blob/main/CONTRIBUTING.md"

[project.scripts]
type-evidence = "type_evidence.cli:main"

[tool.setuptools]
packages = ["type_evidence"]

[tool.setuptools.package-data]
type_evidence = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
