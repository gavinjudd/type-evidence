name: Core portability

on:
  workflow_dispatch:
  push:
    paths:
      - 'type_evidence/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/core-tests.yml'
  pull_request:
    paths:
      - 'type_evidence/**'
      - 'tests/**'
      - 'scripts/**'
      - 'pyproject.toml'
      - '.github/workflows/core-tests.yml'

permissions:
  contents: read

concurrency:
  group: core-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    # Standard runners are free for this public repository. Do not consume
    # paid/private-repository minutes if the repository visibility changes.
    if: github.event.repository.private == false
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install core and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Record runtime
        run: python -m type_evidence doctor
      - name: Run synthetic core regression suite
        run: python -m pytest -q
